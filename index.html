<title>Рыбалка 3.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#ffc83d;--red:#e2453c}
html,body{margin:0;height:100%;overflow:hidden;background:#10222e;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
#bgi,#sleep{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none}
#bgi{bottom:50%;opacity:0;transition:opacity 1s;z-index:0}#bgi.on{opacity:.6}
#sleep{display:none;z-index:3;opacity:.6}
#bg{position:fixed;left:0;right:0;top:0;height:50%;z-index:1;opacity:.7;transition:background .8s}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:8px 10px;color:#fff;font-size:14px;text-shadow:0 1px 4px #000;pointer-events:none;gap:4px;z-index:15}
#hl{display:flex;flex-direction:column;gap:2px}
#hr{display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
#msg{position:fixed;left:8%;right:8%;top:calc(env(safe-area-inset-top,0px) + 92px);text-align:center;color:#fff;font-size:21px;font-weight:bold;text-shadow:0 2px 6px #000;pointer-events:none;line-height:1.2;z-index:5}
#msg small{display:block;font-size:13px;font-weight:normal;margin-top:4px}
#bar{position:fixed;left:12%;right:12%;top:calc(env(safe-area-inset-top,0px) + 165px);height:16px;border:2px solid #fff;border-radius:9px;background:#0007;overflow:hidden;display:none;z-index:6}
#fill{height:100%;width:50%;background:linear-gradient(90deg,var(--red),var(--gold),#6fd36f)}
#stambar{position:fixed;left:12%;right:12%;top:calc(env(safe-area-inset-top,0px) + 186px);height:8px;border:1px solid #fff8;border-radius:5px;background:#0005;overflow:hidden;z-index:5}
#stamfill{height:100%;width:100%;transition:width .4s}
#pan{position:fixed;left:4%;right:4%;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:5%;background:#10222eee;border:2px solid #dff1fa;border-radius:14px;color:#fff;padding:14px;overflow:auto;display:none;z-index:10}
#pan h2{margin:0 0 10px;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #fff3;font-size:15px}
.row small{display:block;opacity:.7;font-size:12px}
button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:7px 11px;background:#ffc83d;color:#10222e;font-weight:bold;cursor:pointer}
button[disabled]{opacity:.4}
.x{background:#fff;float:right;font-size:13px;padding:5px 9px}
.b{background:#dff1fa;font-size:14px;padding:4px 7px;border-radius:8px;pointer-events:auto}
.locs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lb{flex:1 1 30%;font-size:12px;padding:8px 4px;border-radius:10px;background:#1e3f56;color:#fff;border:2px solid transparent}
.lb.on{border-color:var(--gold);background:#2a5570}
#fishcard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0d1e2b;border:3px solid var(--gold);border-radius:16px;padding:14px 16px;color:#fff;text-align:center;width:min(86vw,320px);z-index:20;display:none;flex-direction:column;box-shadow:0 8px 40px #000a}
#fishcard .fi{font-size:48px;line-height:1}
#fishcard h3{margin:6px 0 2px;font-size:18px}
#fc-info{font-size:13px;opacity:.85;margin-bottom:6px}
#fc-record{font-size:12px;color:var(--gold);margin-bottom:6px;min-height:16px}
.fb{display:flex;gap:8px}.fb button{flex:1;padding:9px 6px;font-size:13px}
#tp{position:fixed;inset:0;background-size:cover;background-position:center;z-index:19;display:none;opacity:0;transition:opacity .5s;pointer-events:none}
#tp::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.8))}
#call{position:fixed;left:14%;right:14%;bottom:16%;display:none;z-index:18;background:var(--red);color:#fff;border:4px solid #fff;border-radius:20px;padding:20px 10px;text-align:center;font-size:22px;font-weight:bold;animation:sh .25s infinite;box-shadow:0 0 30px #e2453caa}
#call small{display:block;font-size:14px;font-weight:normal;margin-top:4px}
@keyframes sh{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes z{50%{transform:scale(1.25)}}
</style></head><body>

 if(call){call.l-=dt;ringT-=dt;if(ringT<=0){ringT=.6;beep(880,.12,.25,'square')}if(call.l<=0)failCall()}
 reel+=dt*(st==='fight'?3:0);
 bend+=((st==='fight'?.6:st==='bite'?.35:0)-bend)*Math.min(1,dt*6);
 if(['wait','nib','bite','res'].includes(st)){
  if(!(lg&&wn)&&!call)tm-=dt;
  if(tm<=0){
   if(st==='wait'){if(fake>0){fake--;to('nib',.45);sNib()}else{to('bite',(tro?.55:1.2)*R().w);say(leg?'👑 ОГРОМНАЯ ТЕНЬ!!!':tro?'⚡ ПОДСЕКАЙ!!!':'Клюёт! Подсекай!');navigator.vibrate&&navigator.vibrate(40);sNib()}}
   else if(st==='nib')to('wait',.8+Math.random()*1.5);
   else if(st==='bite'){idle('Сорвалась!','Не успел');sFail()}
   else if(st==='res'&&!pc){st='idle';say('Тапни — закинуть');$('bar').style.display='none'}
  }
 }
 if(st==='fight'){
  ft+=dt;yt-=dt;
  if(yt<=0){yank=yank?0:1;yt=yank?.35:(tro?.5+Math.random()*.7:.9+Math.random()*1.2)}
  prog-=dt*(tro?30:leg?40:20)*R().d*(yank?2:1);
  $('fill').style.width=Math.max(0,Math.min(100,prog))+'%';
  if(prog>=100)win();
  else if(prog<=0)snag('💥 Леска порвалась!');
  else if(ft>16){idle('Ушла!','Тяни быстрее');sFail()}
 }
}

function fish(px,py,s,col,dir,wag){
 x.save();x.translate(px,py);x.scale(dir,1);x.fillStyle=col;
 x.beginPath();x.ellipse(0,0,s,s*.42,0,0,7);x.fill();
 x.beginPath();x.moveTo(s*.8,0);x.lineTo(s*1.45,-s*.45+wag);x.lineTo(s*1.45,s*.45+wag);x.fill();
 x.fillStyle='#0004';x.beginPath();x.moveTo(-s*.2,-s*.38);x.lineTo(s*.2,-s*.75);x.lineTo(s*.45,-s*.3);x.fill();
 x.fillStyle='#fff';x.beginPath();x.arc(-s*.58,-s*.1,s*.11,0,7);x.fill();
 x.fillStyle='#000';x.beginPath();x.arc(-s*.6,-s*.1,s*.05,0,7);x.fill();x.restore();
}
function draw(now){
 const T=now/1000,hx=W*.4,wy=Y0+14,dep=H-wy,hkY0=wy+dep*.5;
 x.clearRect(0,0,W,H);
 const g=x.createLinearGradient(0,wy,0,H);g.addColorStop(0,'#3a95bd');g.addColorStop(.6,'#0f4a6b');g.addColorStop(1,'#051c2b');
 x.fillStyle=g;x.fillRect(0,wy,W,dep);
 x.fillStyle='#8a7a55';x.fillRect(0,H-dep*.07,W,dep*.07);
 x.strokeStyle='#2f7a45';x.lineWidth=4;
 for(let i=0;i<9;i++){const b=W*(i+.5)/9;x.beginPath();x.moveTo(b,H-dep*.06);x.quadraticCurveTo(b+Math.sin(T+i)*10,H-dep*.14,b+Math.sin(T*1.3+i)*14,H-dep*.2);x.stroke()}
 x.fillStyle='#ffffff55';
 bub.forEach(b=>{b.y-=b.v/60;if(b.y<0){b.y=1;b.x=Math.random()}x.beginPath();x.arc(W*b.x+Math.sin(T*2+b.y*9)*4,wy+dep*b.y,2.5,0,7);x.fill()});
 deco.forEach(d=>{d.x+=d.v/60;if(d.x<-.1)d.x=1.1;if(d.x>1.1)d.x=-.1;fish(W*d.x,wy+dep*d.y,d.s,d.c,d.v>0?-1:1,Math.sin(T*8+d.s)*3)});
 x.fillStyle='#eaf6fb';x.fillRect(0,Y0,hx-22,14);x.fillRect(hx+22,Y0,W-hx-22,14);
 x.fillStyle='#b9dbe9';x.fillRect(0,Y0+10,hx-22,4);x.fillRect(hx+22,Y0+10,W-hx-22,4);
 let hkx=hx,hky=hkY0+Math.sin(T*1.5)*3,fx=null,fy,fd=1;
 if(st==='nib'||st==='bite'){fx=hx;hky+=st==='bite'?14:Math.sin(T*40)*3;fy=hky}
 if(st==='fight'){hkx=hx+Math.sin(T*(yank?22:14))*W*.28;hky=hkY0+Math.sin(T*17)*H*.04;fx=hkx;fy=hky;fd=Math.cos(T*(yank?22:14))>0?1:-1}
 if(fx!==null&&F){const s=(tro||leg)?Math.min(70,25+F.w*2):20;fish(fx+(st==='fight'?(fd>0?s*.85:-s*.85):s*.85),fy,s,F.c,st==='fight'?-fd:1,Math.sin(T*(st==='fight'?30:10))*5)}
 if(lg){const lx=W*(1.15-lg.p*.75);x.save();x.translate(lx,hkY0-4);x.rotate(.05);x.fillStyle='#6b4a28';x.fillRect(-60,-11,120,22);x.fillStyle='#8a6a3c';x.beginPath();x.ellipse(-60,0,7,11,0,0,7);x.fill();x.fillStyle='#4a321a';x.fillRect(-30,-11,5,22);x.fillRect(20,-11,5,22);x.restore()}
 if(S.net>0||nlg){const nx=W*.62;x.save();x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1.5;for(let i=0;i<=8;i++){x.beginPath();x.moveTo(nx-20+i*5,wy);x.lineTo(nx-20+i*5,H-dep*.07);x.stroke()}for(let j=0;j<=14;j++){const yy=wy+j*dep*.93/14;x.beginPath();x.moveTo(nx-20,yy);x.lineTo(nx+20,yy);x.stroke()}x.restore()}
 if(nlg){x.save();x.translate(W*(1.15-nlg.p*.75),wy+dep*.3);x.fillStyle='#6b4a28';x.fillRect(-60,-11,120,22);x.fillStyle='#8a6a3c';x.beginPath();x.ellipse(-60,0,7,11,0,0,7);x.fill();x.restore()}
 const bx0=W*1.04,by0=Y0-H*.015,tx=W*.5-bend*W*.05,ty=Y0-H*.2+bend*H*.07,mx=(bx0+tx)/2+bend*10,my=(by0+ty)/2-bend*30;
 x.lineCap='round';x.strokeStyle='#5a3a1c';x.lineWidth=7;x.beginPath();x.moveTo(bx0,by0);x.quadraticCurveTo(mx,my,tx,ty);x.stroke();
 x.strokeStyle=S.rod>=4?'#ffc83d':'#caa772';x.lineWidth=3;x.stroke();
 const rx=W*.9,ry=Y0-H*.045;
 x.fillStyle='#333';x.beginPath();x.arc(rx,ry,24,0,7);x.fill();x.strokeStyle='#bbb';x.lineWidth=3;x.stroke();
 x.save();x.translate(rx,ry);x.rotate(reel);x.strokeStyle='#ddd';
 for(let i=0;i<4;i++){x.rotate(Math.PI/2);x.beginPath();x.moveTo(0,0);x.lineTo(19,0);x.stroke()}
 x.fillStyle='#ffc83d';x.beginPath();x.arc(19,0,5,0,7);x.fill();x.restore();
 x.font='42px serif';x.textAlign='left';x.fillText(SK().e,W*.06,Y0-6);
 if(['wait','nib','bite','fight'].includes(st)){
  const by=wy-2+(st==='bite'?10:st==='nib'?Math.sin(T*40)*2+4:0);
  x.strokeStyle='#ffffffcc';x.lineWidth=1.5;x.beginPath();x.moveTo(tx,ty);x.lineTo(hx,Y0-4);x.stroke();
  x.beginPath();x.moveTo(hx,st==='fight'?Y0+14:wy);x.lineTo(hkx,hky);x.stroke();
  x.strokeStyle='#ddd';x.lineWidth=2.5;x.beginPath();x.arc(hkx+4,hky+7,6,-1.2,2.2);x.stroke();
  if(st!=='fight'){x.fillStyle=SK().b;x.beginPath();x.arc(hx,by-3,8,Math.PI,0);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(hx,by-3,8,0,Math.PI);x.fill()}
 }
 if(S.stam<30){x.fillStyle='rgba(0,0,0,'+(30-S.stam)/60+')';x.fillRect(0,0,W,H)}
}
function loop(n){const dt=Math.min(.05,(n-lastT)/1000);lastT=n;upd(dt);draw(n);requestAnimationFrame(loop)}

function showPan(t){const p=$('pan');p.innerHTML='<button class="x ui" onclick="$(\'pan\').style.display=\'none\'">✕ Закрыть</button>'+t;p.style.display='block'}
const row=(a,s,b)=>'<div class="row"><span>'+a+'<small>'+s+'</small></span>'+b+'</div>';
const my='<p style="font-size:14px;margin:0 0 10px;opacity:.7">У вас: 🪙 ';
function openShop(){
 let t='<h2>🎣 Удочки</h2>'+my+S.coins+' · Ур.'+LVL()+'</p>';
 RODS.forEach((r,i)=>{
  const inf='Сила ×'+r.g+' · Скорость ×'+r.d+' · Окно ×'+r.w+' · Трофеи +'+Math.round(r.t*100)+'%';
  t+=row(r.n,inf,S.own[i]?'<button '+(S.rod===i?'disabled':'')+' onclick="eqRod('+i+')">'+(S.rod===i?'В руках':'Взять')+'</button>':
   LVL()<r.lv?'<button disabled>🔒 Ур.'+r.lv+'</button>':'<button '+(S.coins<r.c?'disabled':'')+' onclick="buyRod('+i+')">'+r.c+' 🪙</button>');
 });showPan(t)}
function buyRod(i){if(S.coins>=RODS[i].c&&LVL()>=RODS[i].lv){S.coins-=RODS[i].c;S.own[i]=1;S.rod=i;save();ui();sBuy();openShop()}}
function eqRod(i){S.rod=i;save();ui();openShop()}
function openSkins(){
 let t='<h2>👤 Скины рыбака</h2>'+my+S.coins+'</p>';
 SKINS.forEach((k,i)=>{t+=row(k.e+' '+k.n,'Свой цвет поплавка',S.sk[i]?'<button '+(S.skin===i?'disabled':'')+' onclick="S.skin='+i+';save();ui();openSkins()">'+(S.skin===i?'Надет':'Надеть')+'</button>':'<button '+(S.coins<k.c?'disabled':'')+' onclick="buySkin('+i+')">'+k.c+' 🪙</button>')});
 showPan(t)}
function buySkin(i){if(S.coins>=SKINS[i].c){S.coins-=SKINS[i].c;S.sk[i]=1;S.skin=i;save();ui();sBuy();openSkins()}}
function openStore(){
 let t='<h2>🏪 Магазин</h2>'+(S.stam<25?'<div style="background:#e2453c33;border:1px solid #e2453c;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:8px">⚠️ Ты сильно устал! Купи еды или кофе.</div>':'')+my+S.coins+' · 🪝 '+S.hooks+'</p>';
 STORE.forEach((o,i)=>{t+=row(o.e+' '+o.n,o.d,'<button '+(S.coins<o.p?'disabled':'')+' onclick="buyItem('+i+')">'+o.p+' 🪙</button>')});
 showPan(t)}
function buyItem(i){
 const o=STORE[i],e=S.effects;if(S.coins<o.p)return;S.coins-=o.p;sBuy();
 ({h5:()=>S.hooks+=5,h20:()=>S.hooks+=20,s30:()=>restore(30),s20:()=>restore(20),s100:()=>restore(100),vod:()=>{e.vodka=3;drain(20)},worm:()=>e.worm+=3,en:()=>e.energy+=30,cat:()=>e.cat=120,net:()=>S.net+=7})[o.f]();
 save();ui();openStore()}
function openLocs(){
 let t='<h2>🗺️ Места</h2><div class="locs">';
 LOCS.forEach(l=>{const lk=LVL()<l.lv;t+='<button class="lb ui '+(S.loc===l.id?'on':'')+'" '+(lk?'disabled':'')+' onclick="setLoc(\''+l.id+'\');$(\'pan\').style.display=\'none\'">'+(lk?'🔒':l.e)+'<br>'+l.n+(lk?'<br>Ур.'+l.lv:'')+'</button>'});
 t+='</div>';
 LOCS.forEach(l=>{const f=FB[l.id];t+='<div style="margin-bottom:8px"><b>'+l.e+' '+l.n+'</b> <small style="opacity:.7">×'+l.m+' цены</small><br><small>Трофеи: '+f.tr.map(a=>a[0]).join(', ')+'</small><br><small>👑 '+f.lg[0][0]+'</small></div>'});
 showPan(t)}
function openRecs(){
 const r=S.rec;let t='<h2>🏆 Рекорды</h2>';
 t+=row('Уровень рыбака','XP '+S.xp,'<b>'+LVL()+'</b>')+row('Поймано рыбы','','<b>'+r.fish+'</b>')+row('Трофеев и Легенд','','<b>'+r.tro+'</b>')+row('Самая тяжёлая','','<b>'+(r.best?r.bn+' '+r.best+' кг':'—')+'</b>');
 t+='<h2 style="margin-top:14px">По местам</h2>';LOCS.forEach(l=>t+=row(l.e+' '+l.n,'','<b>'+(r.byLoc[l.id]||0)+'</b>'));
 t+='<h2 style="margin-top:14px">Коллекция</h2>';
 Object.values(FB).forEach(f=>f.tr.concat(f.lg).forEach(a=>{const w=r.sp[a[0]];t+=row(a[1]+' '+a[0],'','<b>'+(w?'✓ '+w+' кг':'—')+'</b>')}));
 showPan(t)}
function openCat(){
 const c=S.effects.cat;
 showPan('<h2>🐈 Кот-Помощник</h2>'+(c>0?row('Статус','Помогает ловить трофеи','<b>Сыт ('+Math.ceil(c)+' сек)</b>'):row('Статус','Покорми в магазине: +10% к трофеям','<b>Голоден 😿</b>')))}
function openDaily(){
 if(Date.now()-S.lastDaily<=864e5){showPan('<h2>🎁 Бонус</h2><p>Возвращайся завтра!</p>');return}
 S.lastDaily=Date.now();const r=Math.random(),e=S.effects;let m;
 if(r<.5){S.coins+=500;m='500 монет! 🪙'}else if(r<.7){S.hooks+=10;m='10 крючков! 🪝'}else if(r<.85){e.vodka=Math.min(3,e.vodka+1);m='Водка! 🍾'}else{e.energy+=60;m='Энергетик на минуту! 🥤'}
 save();ui();showPan('<h2>🎁 Ежедневный бонус!</h2><p style="font-size:18px;text-align:center;margin:20px 0;color:var(--gold)">Тебе выпало: '+m+'</p>')}

setInterval(()=>{const e=S.effects;if(e.cat>0){e.cat--;if(e.cat===0){say('🐈 Кот проголодался','Покорми его в магазине');ui()}save()}},1000);
setLoc(S.loc);say('Тапни — закинуть','Следи за брёвнами и за телефоном!');ui();requestAnimationFrame(loop);
try{if(TW){TW.ready();TW.expand()}}catch(e){}
if(CS)try{CS.getItem('fish3',(err,v)=>{try{const q=v&&JSON.parse(v);if(q&&q.rec&&(q.xp||0)>=S.xp){S=Object.assign(S,q);norm();setLoc(S.loc);ui();say('👤 '+(TGU?TGU.first_name:'Игрок'),'Прогресс загружен из аккаунта Telegram')}else save()}catch(e){}})}catch(e){}
</script></body></html>
